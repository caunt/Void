name: "Publish Client Platform Images"

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      minecraft-versions:
        type: string
        required: false
        default: '[]'
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      architecture:
        type: string
        required: true
    outputs:
      digests:
        description: JSON mapping of final image tags to platform digests.
        value: ${{ jobs.build.outputs.digests }}

permissions:
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and push client platform images
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MINECRAFT_VERSIONS: ${{ inputs.minecraft-versions }}
          PLATFORM: ${{ inputs.platform }}
          ARCHITECTURE: ${{ inputs.architecture }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/portable-minecraft-client
          CACHE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/portable-minecraft-client-buildcache
          DIGESTS_FILE: ${{ runner.temp }}/client-digests.json
          MAX_ATTEMPTS: 5
          RETRY_DELAY_SECONDS: 10
        run: bash .github/scripts/build-client-platform-images
