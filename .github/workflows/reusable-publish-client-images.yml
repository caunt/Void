name: "Publish Client Images"

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      minecraft-versions:
        type: string
        required: false
        default: '[]'

permissions:
  packages: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate inputs
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MINECRAFT_VERSIONS: ${{ inputs.minecraft-versions }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            latest|offline)
              jq -e 'type == "array" and length == 0' <<< "$MINECRAFT_VERSIONS" > /dev/null
              ;;
            version)
              jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<< "$MINECRAFT_VERSIONS" > /dev/null
              ;;
            *)
              echo "Unsupported client image target: $TARGET"
              exit 1
              ;;
          esac

  build-amd64:
    needs: validate
    uses: ./.github/workflows/reusable-publish-client-platform.yml
    secrets: inherit
    with:
      target: ${{ inputs.target }}
      minecraft-versions: ${{ inputs.minecraft-versions }}
      runner: ubuntu-24.04
      platform: linux/amd64
      architecture: amd64

  build-arm64:
    needs: validate
    uses: ./.github/workflows/reusable-publish-client-platform.yml
    secrets: inherit
    with:
      target: ${{ inputs.target }}
      minecraft-versions: ${{ inputs.minecraft-versions }}
      runner: ubuntu-24.04-arm
      platform: linux/arm64
      architecture: arm64

  publish:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified client manifests
        shell: bash
        env:
          AMD64_DIGESTS: ${{ needs.build-amd64.outputs.digests }}
          ARM64_DIGESTS: ${{ needs.build-arm64.outputs.digests }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/portable-minecraft-client
        run: bash .github/scripts/publish-client-manifests
